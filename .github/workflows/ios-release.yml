name: iOS Release to TestFlight

on:
  workflow_dispatch:  # Actions 탭에서 수동 실행

jobs:
  release:
    runs-on: macos-14  # Apple Silicon (M1) macOS 환경

    steps:
      # ── 1. 소스 코드 가져오기 ──
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Flutter 설치 ──
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.4'
          cache: true

      # ── 3. Firebase 설정 파일 복원 ──
      - name: Restore Firebase config files
        env:
          GOOGLESERVICE_INFO_PLIST_BASE64: ${{ secrets.GOOGLESERVICE_INFO_PLIST_BASE64 }}
          GOOGLESERVICE_INFO_PLIST: ${{ secrets.GOOGLESERVICE_INFO_PLIST }}
          FIREBASE_OPTIONS_DART: ${{ secrets.FIREBASE_OPTIONS_DART }}
        run: |
          echo "$FIREBASE_OPTIONS_DART" > lib/firebase_options.dart
          if [ -n "$GOOGLESERVICE_INFO_PLIST_BASE64" ]; then
            echo "$GOOGLESERVICE_INFO_PLIST_BASE64" | base64 --decode > ios/Runner/GoogleService-Info.plist
          elif [ -n "$GOOGLESERVICE_INFO_PLIST" ]; then
            echo "$GOOGLESERVICE_INFO_PLIST" > ios/Runner/GoogleService-Info.plist
          else
            echo "ERROR: Neither GOOGLESERVICE_INFO_PLIST_BASE64 nor GOOGLESERVICE_INFO_PLIST is set"
            exit 1
          fi

      # ── 4. 임시 키체인 생성 및 Apple 배포 인증서(.p12) 등록 ──
      - name: Install Apple Distribution Certificate
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.IOS_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)

          # 임시 키체인 생성 및 잠금 해제
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # .p12 인증서 복원 및 키체인에 등록
          echo "$BUILD_CERTIFICATE_BASE64" | base64 --decode > $RUNNER_TEMP/cert.p12
          security import $RUNNER_TEMP/cert.p12 -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # 키체인 검색 목록에 추가 및 기본 키체인으로 설정
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')
          security default-keychain -s "$KEYCHAIN_PATH"

      # ── 5. App Store 프로비저닝 프로필 설치 ──
      - name: Install Provisioning Profile
        env:
          PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
        run: |
          PROFILES_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILES_DIR"
          PP_PATH="$RUNNER_TEMP/profile.mobileprovision"
          echo "$PROVISION_PROFILE_BASE64" | base64 --decode > "$PP_PATH"

          # UUID 추출 후 UUID 이름과 프로필 이름 모두로 복사 (어떤 방식으로 찾아도 매칭되도록 보장)
          UUID=$(security cms -D -i "$PP_PATH" | grep -A1 '<key>UUID</key>' | grep -o '[0-9a-fA-F-]\{36\}' | head -n 1)
          if [ -n "$UUID" ]; then
            cp "$PP_PATH" "$PROFILES_DIR/$UUID.mobileprovision"
          fi
          cp "$PP_PATH" "$PROFILES_DIR/Baechutnip_AppStore.mobileprovision"

      # ── 6. 의존성 설치 및 CocoaPods 세팅 ──
      - name: Install dependencies & Pods
        run: |
          flutter pub get
          cd ios
          pod install
          cd ..

      # ── 7. 정적 분석 (info/warning은 출력만, error만 실패) ──
      - name: Analyze code
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      # ── 8. 테스트 ──
      - name: Run tests
        run: flutter test

      # ── 9. ExportOptions.plist 생성 ──
      - name: Generate ExportOptions.plist
        run: |
          cat > ios/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store</string>
              <key>teamID</key>
              <string>HZ9V824V87</string>
              <key>signingStyle</key>
              <string>manual</string>
              <key>signingCertificate</key>
              <string>Apple Distribution</string>
              <key>provisioningProfiles</key>
              <dict>
                  <key>com.yoohyun.plantManagementApp</key>
                  <string>Baechutnip_AppStore</string>
              </dict>
              <key>manageAppVersionAndBuildNumber</key>
              <false/>
              <key>uploadSymbols</key>
              <true/>
          </dict>
          </plist>
          EOF

      # ── 10. 릴리스 IPA 빌드 ──
      - name: Build Release IPA
        run: |
          flutter build ipa --release --export-options-plist=ios/ExportOptions.plist

      # ── 11. IPA 파일 경로 탐색 ──
      - name: Locate IPA file
        id: locate_ipa
        run: |
          IPA_FILE=$(find build/ios/ipa -name "*.ipa" | head -n 1)
          if [ -z "$IPA_FILE" ]; then
            echo "ERROR: No IPA file found in build/ios/ipa"
            exit 1
          fi
          echo "Found IPA: $IPA_FILE"
          echo "ipa_path=$IPA_FILE" >> $GITHUB_OUTPUT

      # ── 12. 빌드 결과물 저장 (GitHub Actions 아티팩트 다운로드용) ──
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-ipa
          path: ${{ steps.locate_ipa.outputs.ipa_path }}

      # ── 13. App Store Connect API 키 복원 ──
      - name: Prepare App Store Connect API Key
        id: asc_key
        env:
          ASC_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
        run: |
          DECODED_KEY=$(echo "$ASC_KEY_BASE64" | base64 --decode)
          # 로그 노출 방지 마스킹
          echo "::add-mask::$DECODED_KEY"
          # GITHUB_OUTPUT에 멀티라인 저장
          echo "private_key<<EOF" >> $GITHUB_OUTPUT
          echo "$DECODED_KEY" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      # ── 14. TestFlight에 자동 업로드 ──
      - name: Upload to TestFlight
        uses: apple-actions/upload-testflight-build@v4
        with:
          app-path: ${{ steps.locate_ipa.outputs.ipa_path }}
          issuer-id: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          api-key-id: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          api-private-key: ${{ steps.asc_key.outputs.private_key }}

      # ── 15. 임시 키체인 정리 ──
      - name: Clean up keychain
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/app-signing.keychain-db" ]; then
            security delete-keychain "$RUNNER_TEMP/app-signing.keychain-db" || true
          fi
